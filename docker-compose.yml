version: "3.8"

services:
  api:
    build: .
    container_name: rec-ranking-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REC_CONFIG_PATH=configs/config.yaml
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
    command: uvicorn src.serving.app:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    container_name: rec-ranking-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - REC_CONFIG_PATH=configs/config.yaml
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./reports:/app/reports:ro
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: rec-ranking-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: mlflow server --backend-store-uri /mlflow/mlruns --host 0.0.0.0 --port 5000
