[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-rec-ranking"
version = "1.0.0"
description = "End-to-end e-commerce recommendation multi-channel recall and CTR ranking system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["recommendation-system", "ctr-prediction", "deepfm", "lightgbm", "itemcf", "item2vec", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "lightgbm>=4.0.0",
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.28.0",
    "mlflow>=2.8.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "pydantic>=1.10.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]

[project.scripts]
rec-api = "src.serving.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
